<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Thunderbolt Arcade — Game Loop &amp; Collision Engine</title>
<desc id="d">A schematic diagram of the Thunderbolt Arcade engine showing deterministic tile traversal, Pikachu power state machines, and real-time canvas rendering.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#72918A" stroke-opacity=".085"/></pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172225"/><stop offset="1" stop-color="#1F292B"/></linearGradient>
</defs>
<style>
@keyframes pacMove{0%,100%{transform:translateX(0)}50%{transform:translateX(180px)}}
@keyframes chomp{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.2)}}
@keyframes pulsePellet{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.player-sprite{animation:pacMove 6s ease-in-out infinite}
.pellet{animation:pulsePellet 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){.player-sprite,.pellet{animation:none}}
</style>
<rect width="1200" height="300" rx="11" fill="url(#bg)"/><rect width="1200" height="300" rx="11" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="298" rx="10" fill="none" stroke="#44605A"/>
<rect x="1" y="1" width="1198" height="37" rx="10" fill="#253233"/><path d="M0 38H1200" stroke="#405B56"/>
<circle cx="23" cy="19" r="4" fill="#DDA269"/><circle cx="39" cy="19" r="4" fill="#80A79B"/><circle cx="55" cy="19" r="4" fill="#597A74"/>
<text x="77" y="25" fill="#AFC7B9" font-family="Consolas,monospace" font-size="13">thunderbolt-arcade / engine-loop</text>
<text x="1175" y="25" fill="#859F97" text-anchor="end" font-family="Consolas,monospace" font-size="12">CANVAS 2D  /  60 FPS</text>

<!-- Left Details Column -->
<g>
  <text x="35" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" letter-spacing="-1" fill="#EFE9DB">Thunderbolt Arcade</text>
  <text x="37" y="114" font-family="Consolas,monospace" font-size="13.5" fill="#C5A37E">deterministic 2D gameplay loop</text>
  <path d="M38 132H385" stroke="#567069" stroke-width="1"/>
  <text x="38" y="160" font-family="Consolas,monospace" font-size="13" fill="#B8CBC1">• tile-based deterministic collision</text>
  <text x="38" y="186" font-family="Consolas,monospace" font-size="13" fill="#B8CBC1">• Pikachu electric power-up state loop</text>
  <text x="38" y="212" font-family="Consolas,monospace" font-size="13" fill="#B8CBC1">• zero-external-dependency Web Audio</text>
  <rect x="38" y="234" width="343" height="3" fill="#3A5651"/><rect x="38" y="234" width="128" height="3" fill="#C28C62"/>
  <text x="38" y="268" font-family="Consolas,monospace" font-size="11.5" letter-spacing="1.2" fill="#8AA59B">SOURCE REPOSITORY</text>
  <text x="210" y="268" font-family="Consolas,monospace" font-size="11.5" fill="#DDA269">Pacman-Pokemon-Edition</text>
</g>

<!-- Right Arcade Simulation Frame -->
<g>
  <rect x="420" y="56" width="755" height="224" rx="8" fill="#141D1E" stroke="#4B6961" stroke-width="1.3"/>
  
  <!-- Arcade Sub-Header -->
  <rect x="421" y="57" width="753" height="28" rx="7" fill="#1C2729"/>
  <text x="440" y="76" font-family="Consolas,monospace" font-size="11" fill="#91BBAB">STAGE 01 // THUNDERBOLT MAZE</text>
  <text x="1155" y="76" text-anchor="end" font-family="Consolas,monospace" font-size="11" fill="#D2A678">SCORE: 0420  LIVES: ♥♥♥</text>

  <!-- Maze Walls Structure -->
  <g fill="none" stroke="#36504C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 450 115 L 680 115 L 680 160 L 760 160"/>
    <path d="M 760 115 L 1130 115"/>
    <path d="M 450 240 L 720 240 L 720 195 L 820 195"/>
    <path d="M 820 240 L 1130 240"/>
    <path d="M 860 145 L 940 145 L 940 210 L 1020 210"/>
    <path d="M 520 150 L 520 205 L 620 205"/>
  </g>

  <!-- Pellets -->
  <g fill="#DDA269" opacity=".75">
    <circle cx="485" cy="177" r="3"/>
    <circle cx="535" cy="177" r="3"/>
    <circle cx="585" cy="177" r="3"/>
    <circle cx="635" cy="177" r="3"/>
    <circle cx="685" cy="177" r="3"/>
    <circle cx="735" cy="177" r="3"/>
    <circle cx="785" cy="177" r="3"/>
    <circle cx="835" cy="177" r="3"/>
    <circle cx="885" cy="177" r="3"/>
    <circle cx="935" cy="177" r="3"/>
    <circle cx="985" cy="177" r="3"/>
    <circle cx="1035" cy="177" r="3"/>
  </g>

  <!-- Power Pellet (Pikachu Thunder Orb) -->
  <circle cx="1075" cy="177" r="7" fill="#F4D06F" class="pellet"/>
  <polygon points="1075,170 1070,178 1074,178 1072,184 1080,175 1076,175" fill="#DDA269"/>

  <!-- Moving Character Sprite (Pikachu/Player) -->
  <g class="player-sprite" transform="translate(485, 177)">
    <circle cx="0" cy="0" r="14" fill="#F4D06F"/>
    <!-- Cute Ear tips -->
    <polygon points="-12,-10 -16,-22 -9,-14" fill="#1A1C1E"/>
    <polygon points="12,-10 16,-22 9,-14" fill="#1A1C1E"/>
    <!-- Cheeks & Eye -->
    <circle cx="8" cy="-2" r="2.5" fill="#1A1C1E"/>
    <circle cx="10" cy="5" r="3.5" fill="#EF233C"/>
    <!-- Electrical spark aura -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#DDA269" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Telemetry HUD Footer inside the screen -->
  <text x="445" y="265" font-family="Consolas,monospace" font-size="10" fill="#75938B">
    INPUT LATENCY: <tspan fill="#A4C8BE">0ms</tspan> // VELOCITY: <tspan fill="#A4C8BE">2.5 px/frame</tspan> // COLLISION: <tspan fill="#DDA269">GRID ALIGNED</tspan>
  </text>
</g>
</svg>
