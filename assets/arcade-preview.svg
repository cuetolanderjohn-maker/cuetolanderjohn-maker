<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Thunderbolt Arcade — Game Loop &amp; Collision Engine</title>
<desc id="d">A schematic diagram of the Thunderbolt Arcade engine showing deterministic tile traversal, Pikachu power state machines, and real-time canvas rendering.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ef233c" stroke-opacity=".08"/></pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090e"/><stop offset="1" stop-color="#0d1017"/></linearGradient>
</defs>
<style>
@keyframes pacMove{0%,100%{transform:translateX(0)}50%{transform:translateX(180px)}}
@keyframes pulsePellet{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.player-sprite{animation:pacMove 6s ease-in-out infinite}
.pellet{animation:pulsePellet 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){.player-sprite,.pellet{animation:none}}
</style>
<rect width="1200" height="300" rx="11" fill="url(#bg)"/><rect width="1200" height="300" rx="11" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="298" rx="10" fill="none" stroke="#232738"/>
<rect x="1" y="1" width="1198" height="37" rx="10" fill="#131722"/><path d="M0 38H1200" stroke="#232738"/>
<circle cx="23" cy="19" r="4.5" fill="#ef233c"/><circle cx="40" cy="19" r="4.5" fill="#f97316"/><circle cx="57" cy="19" r="4.5" fill="#38bdf8"/>
<text x="80" y="25" fill="#ef233c" font-family="Consolas,monospace" font-size="13" font-weight="bold">[ARCADE ENGINE]: THUNDERBOLT MAZE</text>
<text x="1175" y="25" fill="#94a3b8" text-anchor="end" font-family="Consolas,monospace" font-size="12">CANVAS 2D &#8226; 60 FPS &#8226; SYNTH AUDIO</text>

<!-- Left Details Column -->
<g>
  <rect x="35" y="58" width="120" height="18" rx="3" fill="rgba(239, 35, 60, 0.12)" stroke="rgba(239, 35, 60, 0.4)" stroke-width="1"/>
  <text x="95" y="71" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" font-weight="bold" fill="#ef233c">GAME DEV ENGINE</text>

  <text x="35" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="-1" fill="#f8fafc">Thunderbolt</text>
  <text x="37" y="136" font-family="Consolas,monospace" font-size="13.5" fill="#ef233c">Pacman: Pokemon Edition</text>
  <path d="M38 152H385" stroke="#232738" stroke-width="1.5"/>

  <text x="38" y="178" font-family="Consolas,monospace" font-size="12.5" fill="#cbd5e1">&#8226; Tile-based deterministic collision</text>
  <text x="38" y="202" font-family="Consolas,monospace" font-size="12.5" fill="#cbd5e1">&#8226; Pikachu electric power-pellet state</text>
  <text x="38" y="226" font-family="Consolas,monospace" font-size="12.5" fill="#cbd5e1">&#8226; Custom Web Audio procedural sound FX</text>

  <rect x="38" y="248" width="343" height="3" fill="#1e2433"/><rect x="38" y="248" width="150" height="3" fill="#ef233c"/>
  <text x="38" y="280" font-family="Consolas,monospace" font-size="11" letter-spacing="1.2" fill="#64748b">SOURCE REPO</text>
  <text x="180" y="280" font-family="Consolas,monospace" font-size="11.5" font-weight="bold" fill="#ef233c">Pacman-Pokemon-Edition</text>
</g>

<!-- Right Arcade Simulation Frame -->
<g>
  <rect x="420" y="56" width="755" height="234" rx="8" fill="#0d1017" stroke="#232738" stroke-width="1.3"/>
  <rect x="421" y="57" width="753" height="28" rx="7" fill="#141824"/>
  <text x="440" y="76" font-family="Consolas,monospace" font-size="11" font-weight="bold" fill="#38bdf8">STAGE 01 // THUNDERBOLT MAZE</text>
  <text x="1155" y="76" text-anchor="end" font-family="Consolas,monospace" font-size="11" font-weight="bold" fill="#ef233c">SCORE: 0420 &#8226; LIVES: ♥♥♥</text>

  <!-- Maze Walls Structure -->
  <g fill="none" stroke="#232738" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 450 115 L 680 115 L 680 160 L 760 160"/>
    <path d="M 760 115 L 1130 115"/>
    <path d="M 450 240 L 720 240 L 720 195 L 820 195"/>
    <path d="M 820 240 L 1130 240"/>
    <path d="M 860 145 L 940 145 L 940 210 L 1020 210"/>
    <path d="M 520 150 L 520 205 L 620 205"/>
  </g>

  <!-- Pellets -->
  <g fill="#f97316" opacity=".8">
    <circle cx="485" cy="177" r="3.5"/>
    <circle cx="535" cy="177" r="3.5"/>
    <circle cx="585" cy="177" r="3.5"/>
    <circle cx="635" cy="177" r="3.5"/>
    <circle cx="685" cy="177" r="3.5"/>
    <circle cx="735" cy="177" r="3.5"/>
    <circle cx="785" cy="177" r="3.5"/>
    <circle cx="835" cy="177" r="3.5"/>
    <circle cx="885" cy="177" r="3.5"/>
    <circle cx="935" cy="177" r="3.5"/>
    <circle cx="985" cy="177" r="3.5"/>
    <circle cx="1035" cy="177" r="3.5"/>
  </g>

  <!-- Power Pellet (Pikachu Thunder Orb) -->
  <circle cx="1075" cy="177" r="8" fill="#facc15" class="pellet"/>
  <polygon points="1075,169 1069,178 1074,178 1071,185 1081,174 1076,174" fill="#ef233c"/>

  <!-- Moving Character Sprite (Pikachu/Player) -->
  <g class="player-sprite" transform="translate(485, 177)">
    <circle cx="0" cy="0" r="14" fill="#facc15"/>
    <!-- Cute Ear tips -->
    <polygon points="-12,-10 -16,-22 -9,-14" fill="#0f172a"/>
    <polygon points="12,-10 16,-22 9,-14" fill="#0f172a"/>
    <!-- Cheeks & Eye -->
    <circle cx="8" cy="-2" r="2.5" fill="#0f172a"/>
    <circle cx="10" cy="5" r="3.5" fill="#ef233c"/>
    <!-- Electric Aura -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Telemetry HUD Footer inside the screen -->
  <text x="445" y="272" font-family="Consolas,monospace" font-size="10.5" fill="#64748b">
    INPUT LATENCY: <tspan fill="#38bdf8">0ms</tspan> // VELOCITY: <tspan fill="#38bdf8">60 FPS</tspan> // COLLISION: <tspan fill="#ef233c">DETERMINISTIC</tspan>
  </text>
</g>
</svg>
