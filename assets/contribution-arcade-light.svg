<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 356" width="100%" role="img" aria-labelledby="arcadetitlel arcadedescl">
<title id="arcadetitlel">Kulas contribution arcade — light edition</title>
<desc id="arcadedescl">A retro arcade style illustration of GitHub contributions across the calendar year, light parchment edition.</desc>
<style>
@keyframes arcadeSweepL{0%{transform:translateY(0);opacity:0}20%{opacity:.15}50%{opacity:.1}80%{opacity:.15}100%{transform:translateY(356px);opacity:0}}
@keyframes playerRunL{0%,100%{transform:translate(110px,145px)}40%{transform:translate(450px,145px)}50%{transform:translate(450px,185px)}85%{transform:translate(920px,185px)}92%{transform:translate(920px,145px)}}
@keyframes scorePulseL{0%,100%{opacity:.8}50%{opacity:1;fill:#B8783A}}
.sweepL{animation:arcadeSweepL 7s linear infinite}
.playerL{animation:playerRunL 16s ease-in-out infinite}
.scoreL{animation:scorePulseL 2s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.sweepL,.playerL,.scoreL{animation:none}}
</style>
<defs>
  <pattern id="arcadeGridL" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#607F80" stroke-opacity=".06"/></pattern>
</defs>

<!-- Outer Container -->
<rect width="1200" height="356" rx="12" fill="#F4EFE6"/>
<rect width="1200" height="356" rx="12" fill="url(#arcadeGridL)"/>
<rect x=".8" y=".8" width="1198.4" height="354.4" rx="11.5" fill="none" stroke="#C9BEAF" stroke-width="1.5"/>

<!-- Header Bar -->
<rect width="1200" height="44" rx="12" fill="#EAE2D5"/><path d="M1 44H1199" stroke="#C9BEAF" stroke-width="1"/>
<rect x="22" y="16" width="12" height="12" fill="#C48D61" rx="2"/><rect x="40" y="16" width="12" height="12" fill="#5E8C82" rx="2"/>
<text x="66" y="28" font-family="Consolas,monospace" font-size="15" font-weight="bold" fill="#3D4B46">RETRO ARCADE // COMMITS</text>
<text x="1173" y="28" text-anchor="end" font-family="Consolas,monospace" font-size="12.5" fill="#B8783A" class="scoreL">HIGH SCORE: 0128 // SPEED TIER: 60 FPS</text>

<!-- Calendar Frame -->
<rect x="76" y="85" width="963" height="175" rx="7" fill="#EFE8DD" stroke="#D3C9BD" stroke-width="1.2"/>

<!-- Months Header -->
<g font-family="Consolas,monospace" font-size="10.5" fill="#697C75">
  <text x="92" y="76">Jun</text><text x="175" y="76">Jul</text><text x="258" y="76">Aug</text>
  <text x="341" y="76">Sep</text><text x="424" y="76">Oct</text><text x="507" y="76">Nov</text>
  <text x="590" y="76">Dec</text><text x="673" y="76">Jan</text><text x="756" y="76">Feb</text>
  <text x="839" y="76">Mar</text><text x="922" y="76">Apr</text><text x="995" y="76">May</text>
</g>

<!-- Days Header -->
<g font-family="Consolas,monospace" font-size="10" fill="#758A83">
  <text x="42" y="117">Mon</text><text x="42" y="157">Wed</text><text x="42" y="197">Fri</text>
</g>

<!-- Contribution Cells Background Grid -->
<g fill="#E2D9CD" stroke="#CFC4B7" stroke-width=".6">
  <g transform="translate(90, 100)">
    <rect x="0" y="0" width="13.5" height="15" rx="2"/>
    <rect x="0" y="20" width="13.5" height="15" rx="2"/>
    <rect x="0" y="40" width="13.5" height="15" rx="2"/>
    <rect x="0" y="60" width="13.5" height="15" rx="2"/>
    <rect x="0" y="80" width="13.5" height="15" rx="2"/>
    <rect x="0" y="100" width="13.5" height="15" rx="2"/>
    <rect x="0" y="120" width="13.5" height="15" rx="2"/>

    <rect x="18" y="0" width="13.5" height="15" rx="2"/>
    <rect x="18" y="20" width="13.5" height="15" rx="2"/>
    <rect x="18" y="40" width="13.5" height="15" rx="2"/>
    <rect x="18" y="60" width="13.5" height="15" rx="2"/>
    <rect x="18" y="80" width="13.5" height="15" rx="2"/>
    <rect x="18" y="100" width="13.5" height="15" rx="2"/>
    <rect x="18" y="120" width="13.5" height="15" rx="2"/>

    <rect x="36" y="20" width="13.5" height="15" rx="2" fill="#8DB3A7"/>
    <rect x="36" y="60" width="13.5" height="15" rx="2" fill="#5E8C82"/>

    <!-- Active blocks pattern across columns -->
    <rect x="108" y="20" width="13.5" height="15" rx="2" fill="#5E8C82"/>
    <rect x="108" y="40" width="13.5" height="15" rx="2" fill="#426D63"/>
    <rect x="180" y="60" width="13.5" height="15" rx="2" fill="#C48D61"/>
    <rect x="180" y="80" width="13.5" height="15" rx="2" fill="#5E8C82"/>
    <rect x="252" y="20" width="13.5" height="15" rx="2" fill="#8DB3A7"/>
    <rect x="252" y="40" width="13.5" height="15" rx="2" fill="#C48D61"/>
    <rect x="324" y="40" width="13.5" height="15" rx="2" fill="#5E8C82"/>
    <rect x="324" y="60" width="13.5" height="15" rx="2" fill="#C48D61"/>
    <rect x="396" y="20" width="13.5" height="15" rx="2" fill="#426D63"/>
    <rect x="396" y="40" width="13.5" height="15" rx="2" fill="#C48D61"/>
    <rect x="468" y="60" width="13.5" height="15" rx="2" fill="#5E8C82"/>
    <rect x="540" y="40" width="13.5" height="15" rx="2" fill="#8DB3A7"/>
    <rect x="612" y="20" width="13.5" height="15" rx="2" fill="#C48D61"/>
    <rect x="684" y="60" width="13.5" height="15" rx="2" fill="#5E8C82"/>
    <rect x="756" y="40" width="13.5" height="15" rx="2" fill="#8DB3A7"/>
    <rect x="828" y="20" width="13.5" height="15" rx="2" fill="#C48D61"/>
    <rect x="900" y="40" width="13.5" height="15" rx="2" fill="#426D63"/>
    <rect x="900" y="60" width="13.5" height="15" rx="2" fill="#C48D61"/>
  </g>
</g>

<!-- Animated Pixel Sprite Player -->
<g class="playerL">
  <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#D89A4B"/>
  <rect x="-8" y="-14" width="4" height="6" fill="#2E241E"/>
  <rect x="4" y="-14" width="4" height="6" fill="#2E241E"/>
  <rect x="2" y="-4" width="3" height="3" fill="#2E241E"/>
  <rect x="3" y="1" width="3" height="3" fill="#C93B3B"/>
</g>

<!-- Bottom HUD Log -->
<g font-family="Consolas,monospace" font-size="11.5" fill="#5F706B">
  <text x="76" y="295">STATUS: <tspan fill="#B8783A">ACTIVE CODEBASE</tspan> // PACMAN ENGINE &amp; EVENT MANAGEMENT SYSTEMS</text>
  <text x="76" y="320">PHILOSOPHY: <tspan fill="#3E6159">"Every frame of input latency counts. Mechanics must feel punchy."</tspan></text>
</g>

<!-- Right Legend -->
<g transform="translate(940, 290)" font-family="Consolas,monospace" font-size="11" fill="#5F706B">
  <text x="-35" y="11">Less</text>
  <rect x="0" y="0" width="12" height="12" rx="2" fill="#E2D9CD"/>
  <rect x="16" y="0" width="12" height="12" rx="2" fill="#8DB3A7"/>
  <rect x="32" y="0" width="12" height="12" rx="2" fill="#5E8C82"/>
  <rect x="48" y="0" width="12" height="12" rx="2" fill="#426D63"/>
  <rect x="64" y="0" width="12" height="12" rx="2" fill="#C48D61"/>
  <text x="82" y="11">More</text>
</g>
</svg>
