<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 356" width="100%" role="img" aria-labelledby="arcadetitle arcadedesc">
<title id="arcadetitle">Kulas contribution arcade — night edition</title>
<desc id="arcadedesc">A retro arcade style illustration of GitHub contributions across the calendar year. A pixel player moves across the active contribution days collecting commit pellets, with an animated CRT sweep and arcade score counter.</desc>
<style>
@keyframes arcadeSweep{0%{transform:translateY(0);opacity:0}20%{opacity:.2}50%{opacity:.15}80%{opacity:.2}100%{transform:translateY(356px);opacity:0}}
@keyframes playerRun{0%,100%{transform:translate(110px,145px)}40%{transform:translate(450px,145px)}50%{transform:translate(450px,185px)}85%{transform:translate(920px,185px)}92%{transform:translate(920px,145px)}}
@keyframes scorePulse{0%,100%{opacity:.8}50%{opacity:1;fill:#F4D06F}}
@keyframes boltPulse{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.sweep{animation:arcadeSweep 7s linear infinite}
.player{animation:playerRun 16s ease-in-out infinite}
.score{animation:scorePulse 2s ease-in-out infinite}
.bolt{animation:boltPulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){.sweep,.player,.score,.bolt{animation:none}}
</style>
<defs>
  <pattern id="arcadeGrid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#607F80" stroke-opacity=".08"/></pattern>
</defs>

<!-- Outer Container -->
<rect width="1200" height="356" rx="12" fill="#182226"/>
<rect width="1200" height="356" rx="12" fill="url(#arcadeGrid)"/>
<rect x=".8" y=".8" width="1198.4" height="354.4" rx="11.5" fill="none" stroke="#48635B" stroke-width="1.5"/>

<!-- CRT Scanline Beam -->
<line x1="0" y1="0" x2="1200" y2="0" stroke="#7FB9A7" stroke-width="2" class="sweep"/>

<!-- Header Bar -->
<rect width="1200" height="44" rx="12" fill="#202D32"/><path d="M1 44H1199" stroke="#48635B" stroke-width="1"/>
<rect x="22" y="16" width="12" height="12" fill="#DDA269" rx="2"/><rect x="40" y="16" width="12" height="12" fill="#7FB9A7" rx="2"/>
<text x="66" y="28" font-family="Consolas,monospace" font-size="15" font-weight="bold" fill="#D7DDD0">RETRO ARCADE // COMMITS</text>
<text x="1173" y="28" text-anchor="end" font-family="Consolas,monospace" font-size="12.5" fill="#DDA269" class="score">HIGH SCORE: 0128 // SPEED TIER: 60 FPS</text>

<!-- Calendar Frame -->
<rect x="76" y="85" width="963" height="175" rx="7" fill="#131B1D" stroke="#374F49" stroke-width="1.2"/>

<!-- Months Header -->
<g font-family="Consolas,monospace" font-size="10.5" fill="#8FA89D">
  <text x="92" y="76">Jun</text><text x="175" y="76">Jul</text><text x="258" y="76">Aug</text>
  <text x="341" y="76">Sep</text><text x="424" y="76">Oct</text><text x="507" y="76">Nov</text>
  <text x="590" y="76">Dec</text><text x="673" y="76">Jan</text><text x="756" y="76">Feb</text>
  <text x="839" y="76">Mar</text><text x="922" y="76">Apr</text><text x="995" y="76">May</text>
</g>

<!-- Days Header -->
<g font-family="Consolas,monospace" font-size="10" fill="#7A938A">
  <text x="42" y="117">Mon</text><text x="42" y="157">Wed</text><text x="42" y="197">Fri</text>
</g>

<!-- Contribution Cells Background Grid -->
<g fill="#1E2A2C" stroke="#2F4440" stroke-width=".6">
  <!-- Repeating grid blocks -->
  <g transform="translate(90, 100)">
    <!-- Week 1 to 48 generated grid snippet -->
    <rect x="0" y="0" width="13.5" height="15" rx="2"/>
    <rect x="0" y="20" width="13.5" height="15" rx="2"/>
    <rect x="0" y="40" width="13.5" height="15" rx="2"/>
    <rect x="0" y="60" width="13.5" height="15" rx="2"/>
    <rect x="0" y="80" width="13.5" height="15" rx="2"/>
    <rect x="0" y="100" width="13.5" height="15" rx="2"/>
    <rect x="0" y="120" width="13.5" height="15" rx="2"/>

    <rect x="18" y="0" width="13.5" height="15" rx="2"/>
    <rect x="18" y="20" width="13.5" height="15" rx="2"/>
    <rect x="18" y="40" width="13.5" height="15" rx="2"/>
    <rect x="18" y="60" width="13.5" height="15" rx="2"/>
    <rect x="18" y="80" width="13.5" height="15" rx="2"/>
    <rect x="18" y="100" width="13.5" height="15" rx="2"/>
    <rect x="18" y="120" width="13.5" height="15" rx="2"/>

    <rect x="36" y="0" width="13.5" height="15" rx="2"/>
    <rect x="36" y="20" width="13.5" height="15" rx="2" fill="#3D5F54"/>
    <rect x="36" y="40" width="13.5" height="15" rx="2"/>
    <rect x="36" y="60" width="13.5" height="15" rx="2" fill="#588577"/>
    <rect x="36" y="80" width="13.5" height="15" rx="2"/>
    <rect x="36" y="100" width="13.5" height="15" rx="2"/>
    <rect x="36" y="120" width="13.5" height="15" rx="2"/>

    <!-- Active blocks pattern across columns -->
    <rect x="108" y="20" width="13.5" height="15" rx="2" fill="#588577"/>
    <rect x="108" y="40" width="13.5" height="15" rx="2" fill="#7FB9A7"/>
    <rect x="180" y="60" width="13.5" height="15" rx="2" fill="#DDA269"/>
    <rect x="180" y="80" width="13.5" height="15" rx="2" fill="#7FB9A7"/>
    <rect x="252" y="20" width="13.5" height="15" rx="2" fill="#588577"/>
    <rect x="252" y="40" width="13.5" height="15" rx="2" fill="#DDA269"/>
    <rect x="324" y="40" width="13.5" height="15" rx="2" fill="#7FB9A7"/>
    <rect x="324" y="60" width="13.5" height="15" rx="2" fill="#DDA269"/>
    <rect x="396" y="20" width="13.5" height="15" rx="2" fill="#7FB9A7"/>
    <rect x="396" y="40" width="13.5" height="15" rx="2" fill="#DDA269"/>
    <rect x="468" y="60" width="13.5" height="15" rx="2" fill="#7FB9A7"/>
    <rect x="540" y="40" width="13.5" height="15" rx="2" fill="#588577"/>
    <rect x="612" y="20" width="13.5" height="15" rx="2" fill="#DDA269"/>
    <rect x="684" y="60" width="13.5" height="15" rx="2" fill="#7FB9A7"/>
    <rect x="756" y="40" width="13.5" height="15" rx="2" fill="#588577"/>
    <rect x="828" y="20" width="13.5" height="15" rx="2" fill="#DDA269"/>
    <rect x="900" y="40" width="13.5" height="15" rx="2" fill="#7FB9A7"/>
    <rect x="900" y="60" width="13.5" height="15" rx="2" fill="#DDA269"/>
  </g>
</g>

<!-- Floating Power Lightning Nodes -->
<g fill="#F4D06F" class="bolt">
  <polygon points="275,142 270,150 274,150 272,156 280,147 276,147"/>
  <polygon points="560,142 555,150 559,150 557,156 565,147 561,147"/>
  <polygon points="840,142 835,150 839,150 837,156 845,147 841,147"/>
</g>

<!-- Animated Pixel Sprite Player -->
<g class="player">
  <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#F4D06F"/>
  <!-- Pixel Ears -->
  <rect x="-8" y="-14" width="4" height="6" fill="#1B2224"/>
  <rect x="4" y="-14" width="4" height="6" fill="#1B2224"/>
  <!-- Eyes & Cheeks -->
  <rect x="2" y="-4" width="3" height="3" fill="#1B2224"/>
  <rect x="3" y="1" width="3" height="3" fill="#EF233C"/>
  <!-- Spark particle behind player -->
  <circle cx="-12" cy="0" r="2.5" fill="#DDA269" opacity=".7"/>
</g>

<!-- Bottom HUD Log -->
<g font-family="Consolas,monospace" font-size="11.5" fill="#8CA69D">
  <text x="76" y="295">STATUS: <tspan fill="#DDA269">ACTIVE CODEBASE</tspan> // PACMAN ENGINE &amp; EVENT MANAGEMENT SYSTEMS</text>
  <text x="76" y="320">PHILOSOPHY: <tspan fill="#A2C9BD">"Every frame of input latency counts. Mechanics must feel punchy."</tspan></text>
</g>

<!-- Right Legend -->
<g transform="translate(940, 290)" font-family="Consolas,monospace" font-size="11" fill="#8CA69D">
  <text x="-35" y="11">Less</text>
  <rect x="0" y="0" width="12" height="12" rx="2" fill="#1E2A2C"/>
  <rect x="16" y="0" width="12" height="12" rx="2" fill="#3D5F54"/>
  <rect x="32" y="0" width="12" height="12" rx="2" fill="#588577"/>
  <rect x="48" y="0" width="12" height="12" rx="2" fill="#7FB9A7"/>
  <rect x="64" y="0" width="12" height="12" rx="2" fill="#DDA269"/>
  <text x="82" y="11">More</text>
</g>
</svg>
