<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">EventEase — Cloud-Hosted Event Management Architecture</title>
<desc id="d">A technical diagram showing EventEase client-side event scheduling, authentication routing, and real-time Firebase synchronization.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#72918A" stroke-opacity=".085"/></pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172225"/><stop offset="1" stop-color="#1F292B"/></linearGradient>
</defs>
<style>
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.pulse-glow{animation:pulse 3s ease-in-out infinite}
.flow-line{stroke-dasharray:6 6;animation:flow 2.5s linear infinite}
@media(prefers-reduced-motion:reduce){.flow-line,.pulse-glow{animation:none}}
</style>
<rect width="1200" height="300" rx="11" fill="url(#bg)"/><rect width="1200" height="300" rx="11" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="298" rx="10" fill="none" stroke="#44605A"/>
<rect x="1" y="1" width="1198" height="37" rx="10" fill="#253233"/><path d="M0 38H1200" stroke="#405B56"/>
<circle cx="23" cy="19" r="4" fill="#DDA269"/><circle cx="39" cy="19" r="4" fill="#80A79B"/><circle cx="55" cy="19" r="4" fill="#597A74"/>
<text x="77" y="25" fill="#AFC7B9" font-family="Consolas,monospace" font-size="13">eventease / system-overview</text>
<text x="1175" y="25" fill="#859F97" text-anchor="end" font-family="Consolas,monospace" font-size="12">LIVE DEPLOYMENT  /  FIREBASE</text>

<!-- Left Details Column -->
<g>
  <text x="35" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="750" letter-spacing="-1" fill="#EFE9DB">EventEase</text>
  <text x="37" y="114" font-family="Consolas,monospace" font-size="13.5" fill="#C5A37E">cloud event management system</text>
  <path d="M38 132H385" stroke="#567069" stroke-width="1"/>
  <text x="38" y="160" font-family="Consolas,monospace" font-size="13" fill="#B8CBC1">• secure auth &amp; user role verification</text>
  <text x="38" y="186" font-family="Consolas,monospace" font-size="13" fill="#B8CBC1">• real-time database schedule sync</text>
  <text x="38" y="212" font-family="Consolas,monospace" font-size="13" fill="#B8CBC1">• dynamic responsive attendee UI</text>
  <rect x="38" y="234" width="343" height="3" fill="#3A5651"/><rect x="38" y="234" width="128" height="3" fill="#C28C62"/>
  <text x="38" y="268" font-family="Consolas,monospace" font-size="11.5" letter-spacing="1.2" fill="#8AA59B">PRODUCTION HOSTING</text>
  <text x="210" y="268" font-family="Consolas,monospace" font-size="11.5" fill="#DDA269">eventeasemnt.web.app</text>
</g>

<!-- Right Architecture Schematic -->
<g>
  <rect x="420" y="56" width="755" height="224" rx="8" fill="#192323" stroke="#4B6961" stroke-width="1.3"/>
  <text x="440" y="78" font-family="Consolas,monospace" font-size="11.5" fill="#91BBAB">DATA PIPELINE / CLIENT TO REALTIME FIREBASE</text>
  <text x="1155" y="78" text-anchor="end" font-family="Consolas,monospace" font-size="10.5" fill="#D2A678">REAL-TIME SYNC: ACTIVE</text>

  <!-- Node 1: Client Front-End -->
  <rect x="445" y="105" width="195" height="145" rx="6" fill="#131B1C" stroke="#3D5954"/>
  <rect x="445" y="105" width="195" height="26" rx="6" fill="#202D2E"/>
  <text x="457" y="123" font-family="Consolas,monospace" font-size="11" fill="#A4C4B8">CLIENT BROWSER</text>
  <text x="457" y="156" font-family="Segoe UI,sans-serif" font-size="14" font-weight="bold" fill="#F0E8DC">EventEase App</text>
  <text x="457" y="180" font-family="Consolas,monospace" font-size="11.5" fill="#8AA59D">Vanilla JS / DOM</text>
  <text x="457" y="200" font-family="Consolas,monospace" font-size="11.5" fill="#8AA59D">Dynamic Schedules</text>
  <text x="457" y="230" font-family="Consolas,monospace" font-size="10.5" fill="#66877F">Status: Connected</text>

  <!-- Connecting Stream 1 to 2 -->
  <line x1="640" y1="177" x2="725" y2="177" stroke="#DDA269" stroke-width="2" class="flow-line"/>
  <polygon points="725,173 733,177 725,181" fill="#DDA269"/>

  <!-- Node 2: Logic & Auth Layer -->
  <rect x="733" y="105" width="195" height="145" rx="6" fill="#131B1C" stroke="#3D5954"/>
  <rect x="733" y="105" width="195" height="26" rx="6" fill="#202D2E"/>
  <text x="745" y="123" font-family="Consolas,monospace" font-size="11" fill="#A4C4B8">LOGIC &amp; AUTH</text>
  <text x="745" y="156" font-family="Segoe UI,sans-serif" font-size="14" font-weight="bold" fill="#F0E8DC">State Controller</text>
  <text x="745" y="180" font-family="Consolas,monospace" font-size="11.5" fill="#DDA269">Firebase Auth SDK</text>
  <text x="745" y="200" font-family="Consolas,monospace" font-size="11.5" fill="#8AA59D">Session &amp; Token Auth</text>
  <text x="745" y="230" font-family="Consolas,monospace" font-size="10.5" fill="#7FA99B">Role: Authenticated</text>

  <!-- Connecting Stream 2 to 3 -->
  <line x1="928" y1="177" x2="965" y2="177" stroke="#7FB9A7" stroke-width="2" class="flow-line"/>
  <polygon points="965,173 973,177 965,181" fill="#7FB9A7"/>

  <!-- Node 3: Cloud Database -->
  <rect x="973" y="105" width="180" height="145" rx="6" fill="#131B1C" stroke="#3D5954"/>
  <rect x="973" y="105" width="180" height="26" rx="6" fill="#202D2E"/>
  <text x="985" y="123" font-family="Consolas,monospace" font-size="11" fill="#A4C4B8">CLOUD DATABASE</text>
  <text x="985" y="156" font-family="Segoe UI,sans-serif" font-size="14" font-weight="bold" fill="#F0E8DC">Firestore DB</text>
  <text x="985" y="180" font-family="Consolas,monospace" font-size="11.5" fill="#8AA59D">Real-time Listeners</text>
  <text x="985" y="200" font-family="Consolas,monospace" font-size="11.5" fill="#8AA59D">Snapshot Sync</text>
  <text x="985" y="230" font-family="Consolas,monospace" font-size="10.5" fill="#DDA269">Latency: &lt;50ms</text>
</g>
</svg>
