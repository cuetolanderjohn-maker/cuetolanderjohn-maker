<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-labelledby="t d">
<title id="t">Lander John Cueto — Engineering Portfolio</title>
<desc id="d">Minimalist, editorial dark theme banner with typography and technical stack telemetry.</desc>
<defs>
  <radialGradient id="ambient" cx="80%" cy="20%" r="60%">
    <stop offset="0%" stop-color="#1E293B" stop-opacity=".45"/>
    <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2D3748"/>
    <stop offset="100%" stop-color="#1A202C"/>
  </linearGradient>
</defs>
<style>
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulseDot 2.4s ease-in-out infinite}
</style>
<rect width="1200" height="280" rx="12" fill="#090A0F"/>
<rect width="1200" height="280" rx="12" fill="url(#ambient)"/>
<rect x=".75" y=".75" width="1198.5" height="278.5" rx="11.25" fill="none" stroke="#1E2330"/>

<!-- Left Editorial Stack -->
<g transform="translate(64, 48)">
  <!-- Status Indicator Pill -->
  <rect x="0" y="0" width="232" height="26" rx="13" fill="#111520" stroke="#222B3D" stroke-width="1"/>
  <circle cx="14" cy="13" r="3.5" fill="#10B981" class="pulse"/>
  <text x="26" y="17" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="11.5" font-weight="600" fill="#94A3B8" letter-spacing=".4">ACTIVE • PASIG CITY, PHILIPPINES</text>

  <!-- Name -->
  <text x="0" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-weight="800" font-size="52" letter-spacing="-1.8" fill="#F8FAFC">
    Lander John Cueto
  </text>
  <text x="495" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16" font-weight="500" fill="#64748B">/ kulas</text>

  <!-- Title & Philosophy -->
  <text x="0" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#94A3B8" letter-spacing="-.3">
    Web Applications • 2D Canvas Game Engines • Multimodal AI Pipelines
  </text>
  <text x="0" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13" fill="#64748B">
    Architecture focused on deterministic frame loops, real-time sync, and intelligent agent workflows.
  </text>
</g>

<!-- Right Minimalist Telemetry Card -->
<g transform="translate(820, 48)">
  <rect width="316" height="184" rx="8" fill="#0E121A" stroke="url(#card-border)" stroke-width="1"/>
  
  <rect x="0" y="0" width="316" height="34" rx="8" fill="#141A26"/>
  <text x="16" y="22" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing=".8">SYSTEM BENCHMARKS</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">
    <text x="16" y="64" fill="#64748B">Input Latency</text>
    <text x="300" y="64" text-anchor="end" font-weight="700" fill="#38BDF8">0 ms • 60 FPS</text>

    <text x="16" y="96" fill="#64748B">Cloud State</text>
    <text x="300" y="96" text-anchor="end" font-weight="700" fill="#38BDF8">Firestore Real-time</text>

    <text x="16" y="128" fill="#64748B">Vision Pipeline</text>
    <text x="300" y="128" text-anchor="end" font-weight="700" fill="#E2E8F0">Gemini • Tesseract</text>

    <text x="16" y="160" fill="#64748B">Core Language</text>
    <text x="300" y="160" text-anchor="end" font-weight="700" fill="#E2E8F0">TypeScript • C++</text>
  </g>
</g>
</svg>
