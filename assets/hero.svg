<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-labelledby="t d">
<title id="t">KULAS? — Developer profile</title>
<desc id="d">A charcoal, sea-glass and copper profile banner with a technical grid and a small code editor panel.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#86A3A2" stroke-width=".7" opacity=".11"/></pattern>
  <pattern id="noise" width="57" height="43" patternUnits="userSpaceOnUse"><circle cx="6" cy="15" r=".7" fill="#C6D4CC" opacity=".22"/><circle cx="42" cy="37" r=".65" fill="#DFA36C" opacity=".23"/><circle cx="27" cy="8" r=".6" fill="#FFFFFF" opacity=".12"/></pattern>
