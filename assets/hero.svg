  <linearGradient id="rule"><stop stop-color="#DDA269"/><stop offset=".6" stop-color="#A4C8BE"/><stop offset="1" stop-color="#A4C8BE" stop-opacity=".15"/></linearGradient>
</defs>
<style>
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes progress{0%{transform:translateX(-115px)}100%{transform:translateX(365px)}}
.caret{animation:caret 1.4s steps(1) infinite}.scan{animation:progress 9s linear infinite}
@media(prefers-reduced-motion:reduce){.caret,.scan{animation:none}}
</style>
<rect width="1200" height="350" rx="14" fill="url(#shade)"/>
<rect width="1200" height="350" rx="14" fill="url(#grid)"/>
